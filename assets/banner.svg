<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pwBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#030c18" /><stop offset="50%" stop-color="#081e36" /><stop offset="100%" stop-color="#020810" /></linearGradient>
    <linearGradient id="pwNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"><animate attributeName="stop-color" values="#0ea5e9;#6366f1;#10b981;#0ea5e9" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#6366f1"><animate attributeName="stop-color" values="#6366f1;#ec4899;#0ea5e9;#6366f1" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#10b981"><animate attributeName="stop-color" values="#10b981;#0ea5e9;#6366f1;#10b981" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <linearGradient id="pwGrid" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity="0" /><stop offset="100%" stop-color="#6366f1" stop-opacity="0.35" /></linearGradient>
    <filter id="pwGlow"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>

  <style>
    @keyframes pwFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .floating-bot { animation: pwFloat 5.7s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#pwBg)" />

  <g opacity="0.65">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#pwGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="200" y2="360" stroke="url(#pwGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="400" y2="360" stroke="url(#pwGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="600" y2="360" stroke="url(#pwGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="800" y2="360" stroke="url(#pwGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1000" y2="360" stroke="url(#pwGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#pwGrid)" stroke-width="1.5" />
    <line x1="0" y1="290" x2="1200" y2="290" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <circle cx="200" cy="110" r="140" fill="#0ea5e9" opacity="0.08" filter="url(#pwGlow)" />
  <circle cx="960" cy="170" r="160" fill="#6366f1" opacity="0.12" filter="url(#pwGlow)" />

  <!-- 3D Mobile PWA Shell & AI Synapse Sphere -->
  <g transform="translate(940, 180)" class="floating-bot">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#pwNeon)" stroke-width="2" stroke-dasharray="8 6" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
    </circle>
    <!-- Isometric Phone Body -->
    <polygon points="-45,-65 45,-65 45,65 -45,65" rx="10" fill="#08182c" stroke="#0ea5e9" stroke-width="2" filter="url(#pwGlow)" opacity="0.9" />
    <!-- Chat Bubbles -->
    <rect x="-32" y="-45" width="48" height="18" rx="6" fill="#0ea5e9" opacity="0.8" />
    <rect x="-15" y="-20" width="48" height="18" rx="6" fill="#6366f1" opacity="0.8" />
    <rect x="-32" y="5" width="55" height="18" rx="6" fill="#10b981" opacity="0.8" />

    <!-- Center Neural Spark -->
    <circle cx="0" cy="38" r="8" fill="#0ea5e9" filter="url(#pwGlow)">
      <animate attributeName="r" values="7;11;7" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0ea5e9;#6366f1;#10b981;#0ea5e9" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Badges -->
    <g transform="translate(-120, -50)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#051528" stroke="#0ea5e9" stroke-width="1" />
      <text x="42" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">PWA OFFLINE</text>
    </g>
    <g transform="translate(65, 30)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#051528" stroke="#6366f1" stroke-width="1" />
      <text x="42" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#a5b4fc" text-anchor="middle">GEMINI 1.5</text>
    </g>
    <g transform="translate(-40, 70)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#051528" stroke="#10b981" stroke-width="1" />
      <text x="42" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">SOCKS5 PROXY</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="280" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#0ea5e9" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="2">PROGRESSIVE WEB APP // AI AGENT</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#pwNeon)" filter="url(#pwGlow)" letter-spacing="3">
      PWA CHATBOT
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ Offline-First Gemini AI Progressive Web Application with Proxy Bridge
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#061830" stroke="#0ea5e9" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">📱 Installable PWA</text>

      <rect x="175" y="0" width="160" height="26" rx="6" fill="#061830" stroke="#6366f1" stroke-width="1" />
      <text x="255" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">🤖 Gemini 1.5 Flash</text>

      <rect x="345" y="0" width="150" height="26" rx="6" fill="#061830" stroke="#10b981" stroke-width="1" />
      <text x="420" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">🛡️ Anti-Filter Proxy</text>

      <rect x="505" y="0" width="150" height="26" rx="6" fill="#061830" stroke="#ec4899" stroke-width="1" />
      <text x="580" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">💾 IndexedDB Cache</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#pwNeon)" stroke-width="3" filter="url(#pwGlow)" />
</svg>